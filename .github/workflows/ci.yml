name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        vscode: [stable]
        include:
          # The minimum version in engines.vscode.
          - os: ubuntu-latest
            vscode: 1.90.0
    name: ${{ matrix.os }} / VS Code ${{ matrix.vscode }}
    runs-on: ${{ matrix.os }}
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - if: runner.os != 'Linux'
        run: npm run test:integration
